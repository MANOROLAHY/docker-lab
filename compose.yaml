services:
  web:
    build: .
    image: lab-app:1.0
    ports:
      - "127.0.0.1:8092:8080"
    environment:
      MESSAGE: "Web connecté à la base"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 3s
      timeout: 3s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lab
      POSTGRES_DB: labdb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - labdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d labdb"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  labdata:
